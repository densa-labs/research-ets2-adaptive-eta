[package]
name = "ets2-adaptive-eta-telemetry-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/adaptive-eta-core"]
default-members = [".", "crates/adaptive-eta-core"]
resolver = "3"

[lib]
name = "ets2_adaptive_eta_telemetry_spike"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact crates.io release corresponding to the source revision audited for this
# spike: 16a439a0892235051634fd4f54de3d8ab104f6d0.
scs-sdk-plugin = "=0.1.1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
