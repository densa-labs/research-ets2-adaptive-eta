[package]
name = "telemetry-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adaptive-eta-core = { path = "../adaptive-eta-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
