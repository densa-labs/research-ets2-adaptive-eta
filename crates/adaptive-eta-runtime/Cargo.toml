[package]
name = "adaptive-eta-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adaptive-eta-core = { path = "../adaptive-eta-core" }
telemetry-adapter = { path = "../telemetry-adapter" }
telemetry-transport = { path = "../telemetry-transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
