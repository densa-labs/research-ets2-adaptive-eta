[package]
name = "adaptive-eta-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adaptive-eta-core = { path = "../adaptive-eta-core" }
telemetry-adapter = { path = "../telemetry-adapter" }
telemetry-transport = { path = "../telemetry-transport" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
